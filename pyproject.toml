[project]
name = "vision-system-web"
version = "4.0.0"
description = "VISION-SYSTEM WEB - Sistema Web de Inspeccion Automatizada de Pines en Sockets de Motherboards (VLM Qwen3-VL local)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ReconNext Engineering" }]
dependencies = [
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "Pillow>=10.0",
    "loguru>=0.7",
    "python-multipart>=0.0.9",
    "PyYAML>=6.0",
    "greenlet>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
