services:
  postgres:
    image: postgres:16-alpine
    container_name: vision_postgres
    environment:
      POSTGRES_USER: vision
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env antes de iniciar}
      POSTGRES_DB: vision_system
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-scripts/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vision -d vision_system"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: vision_api
    environment:
      DATABASE_URL: postgresql+asyncpg://vision:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env antes de iniciar}@postgres:5432/vision_system
      STORAGE_BASE_PATH: /app/evidence
      AI_BASE_URL: ${AI_BASE_URL:-http://host.docker.internal:8000/v1}
      AI_MODEL_NAME: ${AI_MODEL_NAME:-qwen3-vl}
      AI_API_KEY: ${AI_API_KEY:-dummy}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-60}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-2}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      VISION_CONFIG: /app/config.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - evidence:/app/evidence
      - api_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    build:
      context: ..
      dockerfile: docker/Dockerfile.nginx
    container_name: vision_nginx
    environment:
      # Puerto HTTPS publicado: se usa en el redirect HTTP -> HTTPS
      VISION_HTTPS_PORT: "${VISION_HTTPS_PORT:-443}"
    volumes:
      # Certificados TLS: generar antes con `bash scripts/gen-certs.sh`
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "8080:80"
      - "${VISION_HTTPS_PORT:-443}:443"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  evidence:
  api_logs:
