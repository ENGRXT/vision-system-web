# VISION-SYSTEM WEB - Locations compartidas (HTTP y HTTPS)
# Requiere: map $http_upgrade $connection_upgrade (definido en nginx.conf)

# --- WebSocket: notificaciones en tiempo real (ws:// en HTTP, wss:// en HTTPS) ---
location /ws/ {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# --- Evidencia (archivos estaticos servidos por la API) ---
location /api/evidence/ {
    proxy_pass http://api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_cache off;
    add_header Cache-Control "public, max-age=86400";
}

# --- API REST ---
location /api/ {
    proxy_pass http://api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;
}

# --- Health checks (docker/monitoring/uptime) ---
location /health {
    proxy_pass http://api;
    proxy_set_header Host $host;
}

# --- Frontend + assets ---
location /static/ {
    proxy_pass http://api;
    proxy_set_header Host $host;
    add_header Cache-Control "no-cache";
}

location / {
    proxy_pass http://api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
